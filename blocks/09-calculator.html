<!-- Taplink · HTML-блок 09-calculator · Калькулятор. Вставлять целиком в блок «HTML-код». -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.ek{
  --paper:#f7f3ec; --sand:#ece3d4; --sand-2:#e2d6c3;
  --ink:#1f1e1c; --graphite:#2b2a27; --muted:#6f6a61; --line:#d9cfbf;
  --accent:#b4553a; --accent-soft:#f1dcd2; --ok:#4f6b4a; --pale:#e3a58f;
  --sans:'Manrope',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  font-family:var(--sans); color:var(--ink); background:var(--paper);
  max-width:480px; margin:0 auto; -webkit-font-smoothing:antialiased;
  font-size:15px; line-height:1.6; overflow:hidden;
}
.ek *{box-sizing:border-box}
.ek h1,.ek h2,.ek h3,.ek p{margin:0}
.ek .ek-pad{padding:56px 22px}
.ek .ek-eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.ek h2{font-weight:800;font-size:29px;line-height:1.15;letter-spacing:-.03em;margin:12px 0 16px}
.ek h2 em{font-style:normal;color:var(--accent)}
.ek .ek-lead{color:var(--muted)}
.ek .ek-ph{background:#fff3b0;color:#5a4a00;padding:0 4px;border-radius:3px;font-weight:700}
.ek .ek-ic{width:1.05em;height:1.05em;display:inline-block;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ek .ek-photo-card{border-radius:20px;overflow:hidden;background:var(--sand)}
.ek .ek-photo-card img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes ekPop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes ekDot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.ek-chat .ek-wall{scroll-behavior:auto}.ek-chat .ek-msg.ek-pop,.ek-chat .ek-dots i{animation:none}}
.ek .ek-cta-btn{display:block;text-align:center;text-decoration:none;background:var(--accent);color:#fff;border-radius:14px;padding:15px 16px 14px;margin-top:20px;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.ek .ek-cta-btn:active{transform:scale(.98)}
.ek .ek-cta-btn .ek-t{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:800;line-height:1.25}
.ek .ek-cta-btn .ek-t .ek-ic{width:18px;height:18px;stroke-width:2.4;flex:0 0 18px}
.ek .ek-cta-btn small{display:block;font-size:12px;font-weight:600;opacity:.85;margin-top:3px}
.ek .ek-cta-btn.ek-light{background:#fff;color:var(--ink)}
.ek .ek-cta-btn.ek-light small{color:var(--muted);opacity:1}
@media (prefers-reduced-motion:reduce){.ek *{transition:none!important}}
.ek .ek-calc{background:var(--sand)}
.ek .ek-calc .ek-tap{display:inline-flex;align-items:center;gap:8px;background:var(--graphite);color:#fff;font-weight:700;font-size:14px;padding:9px 14px;border-radius:22px}
.ek .ek-calc .ek-tap .ek-ic{width:18px;height:18px}
.ek .ek-calc .ek-items{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
.ek .ek-calc button{font:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--sand-2);background:var(--paper);color:var(--ink);padding:9px 13px;border-radius:30px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.ek .ek-calc button[aria-pressed="true"]{background:var(--graphite);border-color:var(--graphite);color:#fff}
.ek .ek-calc .ek-result{background:var(--paper);border-radius:18px;padding:20px}
.ek .ek-calc .ek-sum{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em}
.ek .ek-calc .ek-sum small{font-size:22px}
.ek .ek-calc .ek-bar{height:8px;background:var(--sand);border-radius:8px;margin:16px 0 8px;overflow:hidden}
.ek .ek-calc .ek-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:8px;transition:width .35s}
.ek .ek-calc .ek-hint{font-size:13px;color:var(--muted)}
.ek .ek-calc .ek-hint b{color:var(--ink)}
@media (max-width:600px){.ek{width:100vw;max-width:100vw;margin-left:calc(50% - 50vw)}}
</style>
<div class="ek">
<section class="ek-calc ek-pad">
  <div class="ek-eyebrow">Проверь себя</div>
  <h2>Сколько денег <em>лежит у тебя дома?</em></h2>
  <p class="ek-tap"><svg class="ek-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10"/><path d="M12 10V8.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3.6 15a1.6 1.6 0 0 1 2.6-1.8L9 15.5"/></svg>Отметь, что есть у тебя без дела</p>
  <div class="ek-items" id="ekItems">
    <button type="button" data-v="3500" aria-pressed="false">Куртка / пуховик</button>
    <button type="button" data-v="1500" aria-pressed="false">Обувь</button>
    <button type="button" data-v="2500" aria-pressed="false">Платья и джинсы</button>
    <button type="button" data-v="4000" aria-pressed="false">Детская коляска</button>
    <button type="button" data-v="1500" aria-pressed="false">Детские вещи</button>
    <button type="button" data-v="800" aria-pressed="false">Игрушки</button>
    <button type="button" data-v="3000" aria-pressed="false">Бытовая техника</button>
    <button type="button" data-v="2000" aria-pressed="false">Сумка</button>
    <button type="button" data-v="1200" aria-pressed="false">Косметика, духи</button>
    <button type="button" data-v="2500" aria-pressed="false">Спорт-инвентарь</button>
  </div>
  <div class="ek-result">
    <div class="ek-hint">Примерно</div>
    <div class="ek-sum"><span id="ekSum">0</span> <small>₽</small></div>
    <div class="ek-bar"><i id="ekBar"></i></div>
    <div class="ek-hint" id="ekHint">Клуб стоит <b>4 500 ₽</b> — посмотрим, окупится ли.</div>
  </div>
</section>
</div>
<script>
(function(){
  var wrap=document.getElementById('ekItems'); if(!wrap) return;
  var sumEl=document.getElementById('ekSum'), bar=document.getElementById('ekBar'), hint=document.getElementById('ekHint');
  var PRICE=4500, fmt=function(n){return n.toLocaleString('ru-RU')};
  wrap.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    b.setAttribute('aria-pressed', b.getAttribute('aria-pressed')==='true'?'false':'true');
    var s=0; wrap.querySelectorAll('[aria-pressed="true"]').forEach(function(x){s+=+x.dataset.v});
    sumEl.textContent=fmt(s);
    bar.style.width=Math.min(100,s/(PRICE*4)*100)+'%';
    if(!s) hint.innerHTML='Клуб стоит <b>4 500 ₽</b> — посмотрим, окупится ли.';
    else if(s<PRICE) hint.innerHTML='Почти! Ещё пара вещей — и клуб <b>окупится</b>.';
    else hint.innerHTML='Это <b>в '+(s/PRICE).toFixed(1).replace('.',',')+' раза</b> больше стоимости клуба.';
  });
})();

</script>
